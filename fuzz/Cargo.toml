# This is a standalone cargo-fuzz workspace.  Keeping the fuzz package out of
# the application workspace prevents libfuzzer-sys's native build support from
# entering normal workspace checks.
[workspace]
members = ["."]

[package]
name = "jmeter-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
# Keep the fuzzing ABI/tooling dependency reproducible.  The standalone lock
# records this exact version; normal workspace builds never resolve it.
libfuzzer-sys = "=0.4.13"

[dependencies.jmeter-rs-bridge-protocol]
version = "=0.1.0"
path = "../crates/bridge-protocol"

[dependencies.jmeter-rs-expr]
version = "=0.1.0"
path = "../crates/expr"

[dependencies.jmeter-rs-jmx]
version = "=0.1.0"
path = "../crates/jmx"

[dependencies.jmeter-rs-results]
version = "=0.1.0"
path = "../crates/results"

# These pure, transport/process-free crates provide the bounded protocol and
# state-machine surfaces covered by the TEST-003 targets.  They inherit the
# workspace Apache-2.0 license and Rust 1.97.1 MSRV; no fuzz-only features or
# native dependencies are enabled.  plugin-host's existing serde/nix/sha2
# graph is intentional for JSON preflight and is not used to launch a worker.
[dependencies.jmeter-rs-http]
version = "=0.1.0"
path = "../crates/http"

[dependencies.jmeter-rs-plugin-host]
version = "=0.1.0"
path = "../crates/plugin-host"

[dependencies.jmeter-rs-remote]
version = "=0.1.0"
path = "../crates/remote"

[dependencies.jmeter-rs-runtime]
version = "=0.1.0"
path = "../crates/runtime"

[[bin]]
name = "jmx_xml"
path = "fuzz_targets/jmx_xml.rs"
test = false
doc = false
bench = false

