[package]
name = "jmeter-rs-java-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Local bounded wire contract; no async runtime, JVM bindings, or native ABI.
jmeter-rs-bridge-protocol = { version = "0.1.0", path = "../bridge-protocol" }
# All process ownership is delegated to the private, process-global supervisor.
# The bridge currently uses only its pure capability/ID validation surface and
# remains fail-closed until the typed launch capability is exposed to callers.
jmeter-rs-process-supervision = { version = "0.1.0", path = "../process-supervision" }

[[bin]]
name = "jmeter-rs-java-bridge-fake-worker"
path = "src/bin/fake-worker.rs"
