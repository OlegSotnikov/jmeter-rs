[package]
name = "jmeter-rs-http-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
jmeter-rs-http = { version = "0.1.0", path = "../http" }
hickory-resolver = { version = "=0.26.1", default-features = false, features = ["tokio"] }
async-compression = { version = "=0.4.43", default-features = false, features = ["tokio", "gzip", "zlib", "deflate", "brotli"] }
mio = { version = "=1.2.2", default-features = false, features = ["os-poll", "net"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "sync", "time"] }

[dev-dependencies]
rcgen = { version = "=0.14.9", default-features = false, features = ["crypto", "ring"] }
