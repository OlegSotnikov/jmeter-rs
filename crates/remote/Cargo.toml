[package]
name = "jmeter-rs-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Remote execution carries immutable result snapshots and identities.  The
# result crate is a pure domain dependency; this crate never opens a socket or
# starts an external worker.  It uses no optional features, inherits the
# workspace Rust 1.97.1 MSRV and Apache-2.0 license, and has no native build
# risk.  A local domain dependency is required because the remote protocol
# must preserve the full SampleEvent tree rather than flattening it into an
# ad-hoc transport struct.
jmeter-rs-results = { version = "0.1.0", path = "../results" }
