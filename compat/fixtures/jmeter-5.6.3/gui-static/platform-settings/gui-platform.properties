# Original static settings for GUI-003. No GUI or JMeter process is run here.
# Platform-specific effective values are checked by the future matrix runner.
# Do not put language here: this file is loaded with -q after JMeterUtils.initLocale.
# The future runner sets JMETER_LANGUAGE/JVM user.language and user.region first.
locales.add=fr,de,ja
jmeter.laf=CrossPlatform
jmeter.laf.linux=CrossPlatform
jmeter.laf.windows=System
jmeter.laf.windows_10=System
jmeter.laf.windows_11=System
jmeter.laf.mac=System
jmeter.laf.mac_os_x=System
jmeter.laf.darwin=System
jmeter.toolbar.icons=org/apache/jmeter/images/toolbar/icons-toolbar.properties
jmeter.toolbar.icons.size=22x22
jmeter.toolbar=new,templates,open,save,|,undo,redo,cut,copy,paste,|,expand,collapse,toggle,|,test_start,test_start_notimers,test_stop,test_shutdown,|,test_clear,test_clear_all,|,search,search_reset,|,function_helper,help
jmeter.icons=org/apache/jmeter/images/icon.properties
jmeter.tree.icons.size=19x19
jmeter.hidpi.mode=false
jmeter.hidpi.scale.factor=1.0
onload.expandtree=false
undo.history.size=25
jsyntaxtextarea.maxundos=50
