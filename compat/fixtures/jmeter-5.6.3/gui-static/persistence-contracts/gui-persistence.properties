# Original static settings for GUI-002. No GUI or JMeter process is run here.
# Paths are contract tokens; a future runner must materialize ${JMETER_HOME}
# in an isolated copy before launch. JMeter 5.6.3 reads this value literally;
# it does not expand environment/property syntax in BACKUP_DIRECTORY.
jmeter.gui.action.save.backup_on_save=true
jmeter.gui.action.save.backup_directory=${JMETER_HOME}/backups
jmeter.gui.action.save.keep_backup_max_count=10
jmeter.gui.action.save.keep_backup_max_hours=0
save_automatically_before_run=true
# TemplateManager resolves each entry relative to JMeterHome.
template.files=/bin/templates/templates.xml
onload.expandtree=false
