# Primary JMeter property file selected with -p.
# These names deliberately point at the fixture-local files so the documented
# automatic user/system-property stages are deterministic when the case is
# run from this directory.
user.properties=user.properties
system.properties=system.properties
cfg.source=primary
cfg.order=primary
cfg.repeat=primary-repeat
cfg.escaped=left\=right\:colon\#hash\!bang\\slash
cfg.continuation=primary-first\
  primary-second
cfg.unicode=smile-\u263A-omega-\u03A9
# Literal UTF-8 bytes are intentional input; effective Java Properties decoding
# remains an oracle observation, not a fabricated static value.
cfg.literal.utf8=literal-雪-☃
cfg.empty=
cfg.duplicate=primary-first
cfg.duplicate=primary-last
cfg.default.marker=primary-default-override
jmeter.save.saveservice.output_format=xml
jmeter.save.saveservice.timestamp_format=none
jmeter.save.saveservice.hostname=false
jmeter.save.saveservice.response_data=true
jmeter.save.saveservice.samplerData=true
jmeter.save.saveservice.responseHeaders=true
jmeter.save.saveservice.requestHeaders=true
