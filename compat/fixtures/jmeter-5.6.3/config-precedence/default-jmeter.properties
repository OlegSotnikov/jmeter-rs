# Original minimal replacement for the initial JMeter property file loaded via
# -p. The fixture never relies on an installed jmeter.properties file.
user.properties=user.properties
system.properties=system.properties
cfg.source=default
cfg.default.marker=default-file
cfg.repeat=default-repeat
cfg.escaped=default\=escape\:value
cfg.unicode=default-\u2602
cfg.empty=
cfg.duplicate=default-first
cfg.duplicate=default-last
jmeter.save.saveservice.output_format=xml
jmeter.save.saveservice.timestamp_format=none
jmeter.save.saveservice.hostname=false
jmeter.save.saveservice.response_data=true
jmeter.save.saveservice.samplerData=true
jmeter.save.saveservice.responseHeaders=true
jmeter.save.saveservice.requestHeaders=true
