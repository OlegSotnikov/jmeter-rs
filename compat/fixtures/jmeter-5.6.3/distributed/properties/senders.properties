# Sender-matrix baseline. The runner supplies one mode per isolated
# invocation; these bounds exercise threshold and end-of-test flush paths.
# Port derivation is base=1099: worker registries +0/+1, worker engines +2/+3,
# client.rmi.localport +4, derived thread/sample listeners +5/+6, and
# controller UDP +7. -R is the exact remote_hosts override. The hostname is
# supplied as a JVM -D property by the command, not as a -q JMeter property.
fixture.port.base=1099
remote_hosts=127.0.0.1:1099,127.0.0.1:1100
server_port=1099
server.rmi.localport=1101
client.rmi.localport=1103
server.rmi.ssl.disable=true
client.continue_on_fail=false
client.tries=3
client.retries_delay=250
server.exitaftertest=false
mode=Standard
# Sender mode is resolved from this client-side property view. Worker
# server.properties intentionally has no mode key; it supplies the
# worker-side transport view and is the threshold/queue/strip source only when
# sample_sender_client_configured=false.
sample_sender_client_configured=true
num_sample_threshold=2
time_threshold=250
# Applies only to Asynch/StrippedAsynch modes. DiskStore and
# StrippedDiskStore queue capacity is intentionally unspecified; any disk
# spool bound is external runner policy.
asynch.batch.queue.size=4
jmeter.save.saveservice.output_format=xml
jmeter.save.saveservice.timestamp_format=none
jmeter.save.saveservice.time=true
jmeter.save.saveservice.latency=true
jmeter.save.saveservice.connect_time=true
jmeter.save.saveservice.timestamp=true
jmeter.save.saveservice.successful=true
jmeter.save.saveservice.label=true
jmeter.save.saveservice.response_code=true
jmeter.save.saveservice.response_message=true
jmeter.save.saveservice.thread_name=true
jmeter.save.saveservice.data_type=true
jmeter.save.saveservice.encoding=true
jmeter.save.saveservice.assertions=true
jmeter.save.saveservice.subresults=true
jmeter.save.saveservice.response_data=true
jmeter.save.saveservice.samplerData=false
jmeter.save.saveservice.responseHeaders=false
jmeter.save.saveservice.requestHeaders=false
jmeter.save.saveservice.bytes=true
jmeter.save.saveservice.sent_bytes=true
jmeter.save.saveservice.url=true
jmeter.save.saveservice.filename=true
jmeter.save.saveservice.hostname=false
jmeter.save.saveservice.thread_counts=true
jmeter.save.saveservice.sample_count=true
jmeter.save.saveservice.idle_time=true
jmeter.save.saveservice.assertion_results_failure_message=true
jmeter.save.saveservice.assertion_results=all
sample_variables=worker_identity,plan_marker
