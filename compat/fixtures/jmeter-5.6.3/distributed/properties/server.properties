# Common loopback worker defaults. This is worker-a for base=1099; the runner
# starts worker-b with server_port=1100 (base+1) and
# server.rmi.localport=1102 (base+3). java.rmi.server.hostname is supplied as
# a JVM -D property/RMI_HOST_DEF by the worker command, not here.
fixture.port.base=1099
server_port=1099
server.rmi.localport=1101
server.rmi.ssl.disable=true
server.exitaftertest=false
