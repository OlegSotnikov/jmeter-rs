# SSL worker defaults for worker-a at base=1099. The runner starts worker-b
# with server_port=1100 (base+1) and server.rmi.localport=1102 (base+3).
# Keystore/truststore and secret material are typed protected references
# resolved only by the isolated runner. The hostname is supplied as a JVM -D
# property/RMI_HOST_DEF by the worker command, not here.
fixture.port.base=1099
server_port=1099
server.rmi.localport=1101
server.rmi.ssl.disable=false
server.exitaftertest=false
fixture.ssl.enabled=true
fixture.ssl.keystore_type=JKS
fixture.ssl.truststore_type=JKS
fixture.ssl.keystore_ref=path://rmi/worker-a-keystore.jks
fixture.ssl.truststore_ref=path://rmi/worker-a-truststore.jks
fixture.ssl.path_channel_ref=channel://rmi-tls-material
fixture.ssl.secret_channel_ref=channel://rmi-tls-secrets
fixture.ssl.key_alias=rmi
fixture.ssl.certificate_identity=worker-a-rmi-127.0.0.1
