# Common non-SSL client defaults. The static port block uses base=1099:
# worker registries are base+0/base+1, worker engines are base+2/base+3,
# client.rmi.localport is base+4, and its derived thread/sample listeners are
# base+5/base+6; controller UDP is base+7. A runner may replace these concrete
# values only with the same derived offsets. -R is the exact remote_hosts
# override for the two registry endpoints. java.rmi.server.hostname is a JVM
# -D property supplied by the command, never a -q JMeter property.
fixture.port.base=1099
remote_hosts=127.0.0.1:1099,127.0.0.1:1100
server_port=1099
server.rmi.localport=1101
client.rmi.localport=1103
server.rmi.ssl.disable=true
client.continue_on_fail=false
client.tries=3
client.retries_delay=250
server.exitaftertest=false
mode=Standard
num_sample_threshold=2
time_threshold=250
asynch.batch.queue.size=4
jmeter.save.saveservice.output_format=xml
jmeter.save.saveservice.timestamp_format=none
jmeter.save.saveservice.time=true
jmeter.save.saveservice.latency=true
