# SPDX-License-Identifier: Apache-2.0
#
# Original static corpus index.  No entry in this file is a measured JMeter
# result.  The error codes and limits are planned parser-test targets.

schema = "jmeter-rs.jtl-static-corpus"
schema_version = 1
profile_id = "jmeter-5.6.3"
fixture_family_id = "FX-JTL-001"
fixture_family_refs = ["FX-JTL-001", "FX-CONFIG-001"]
case_id = "ORACLE-JMETER-563-JTL-FIELDS"
evidence_status = "planned"
oracle_invoked = false
measured_output_present = false

[scope]
conformance_ids = ["JTL-001", "JTL-002", "JTL-003", "JTL-004", "JTL-005"]
normalization_policy_refs = ["NORM-JTL-001", "NORM-TIME-001", "NORM-ENV-001", "NORM-CONFIG-001", "NORM-SECURITY-001"]

[bounds]
schema_id = "jmeter-rs.fixture-bounds"
schema_version = 1
enforcement = "declared-and-comparator-enforced"
max_input_bytes = 131072
max_result_bytes = 65536
max_text_bytes = 65536
max_samples = 64
max_depth = 16
max_xml_nodes = 1024
max_xml_attributes = 2048
max_csv_columns = 128
max_line_bytes = 65536

[writer_wire_contract]
description = "inputs/csv and inputs/xml are JMeter 5.6.3 writer-wire-shaped cases; their expected JSON files are planned projections, never measured oracle output."
xml_sample_variable_spelling = "exact-configured-name"
sample_variable_header_rule = "CSV sample-variable header cells are quoted; XML sample-variable names use exact configured names with one underscore."
xml_sample_variable_underscore_doubling = false
xml_string_child_class = "java.lang.String"
xml_url_element = "java.net.URL"
assertion_representation = "assertionResult child elements"
assertion_child_order = ["name", "failure", "error", "failureMessage"]
assertion_failure_message_multiplicity = "optional per assertion; absent when no failure message is present"
csv_failure_message_property = "jmeter.save.saveservice.assertion_results_failure_message"
xml_failure_message_scope = "XML failureMessage is an optional assertionResult child; the CSV property does not gate XML emission"
xml_child_order = ["assertionResult", "subresult", "responseHeader", "requestHeader", "responseData", "responseFile", "samplerData", "java.net.URL"]
wire_order = ["assertionResult", "subresult", "responseHeader", "requestHeader", "responseData", "responseFile", "samplerData", "java.net.URL"]
xml_child_order_scope = "converter order; each expected sample declares only the children actually present"
xml_typed_subresult_excludes = ["java.net.URL"]
response_data_class = "java.lang.String"
response_file_class = "java.lang.String"
url_class = "none"
response_file_policy = "only when filename saving is enabled"
sample_count_error_count_coupling = "SampleCount and ErrorCount are both emitted by the single sample_count save-service switch"
rust_attribute_gap_variant = "variants/rust-no-drop/xml-doubled-variable.xml"

[reader_semantics]
jmeter_reader_contract = [
  {id = "JTL-READER-FILE-001", action = "fallback-load-responseFile-when-responseData-absent", expected = "resource-backed value"},
  {id = "JTL-READER-URL-001", action = "drop-java.net.URL-from-SampleResult", expected = "not-restored"}
]
rust_no_drop_contract = [
  {id = "JTL-RUST-NODROP-ATTR-001", action = "retain-unknown-attributes-exactly", expected = "doubled-variable variant"},
  {id = "JTL-RUST-NODROP-CHILD-001", action = "retain-unknown-child-tree", expected = "pluginData child"},
  {id = "JTL-RUST-NODROP-URL-001", action = "retain-typed-url", expected = "java.net.URL child as typed Rust extension"}
]
projection_rule = "Writer-wire expectations, Rust no-drop projections, JMeter reader-loss actions, invalid-input contracts, and resource-limit contracts are distinct non-comparator contract_kind values."

[runtime_contract]
locale = "en-US"
charset = "UTF-8"
jvm_args = ["-Dfile.encoding=UTF-8", "-Duser.language=en", "-Duser.country=US", "-Duser.timezone=UTC"]
status = "declared for future oracle, not measured"

