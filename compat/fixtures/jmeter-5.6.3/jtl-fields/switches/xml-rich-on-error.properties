# Static property vector: rich XML children and response-on-error.
# This is a planned save-service configuration, not an oracle observation.
jmeter.save.saveservice.output_format=xml
# XML timestamp attributes remain millisecond values; date formatting is CSV-only.
jmeter.save.saveservice.timestamp_format=ms
sampleresult.timestamp.start=true
jmeter.save.saveservice.time=true
jmeter.save.saveservice.latency=true
jmeter.save.saveservice.connect_time=true
jmeter.save.saveservice.successful=true
jmeter.save.saveservice.label=true
jmeter.save.saveservice.response_code=true
jmeter.save.saveservice.response_message=true
jmeter.save.saveservice.thread_name=true
jmeter.save.saveservice.data_type=true
jmeter.save.saveservice.encoding=true
jmeter.save.saveservice.assertions=true
jmeter.save.saveservice.subresults=true
jmeter.save.saveservice.response_data=false
jmeter.save.saveservice.response_data.on_error=true
jmeter.save.saveservice.responseHeaders=true
jmeter.save.saveservice.requestHeaders=true
jmeter.save.saveservice.samplerData=true
jmeter.save.saveservice.filename=false
jmeter.save.saveservice.hostname=true
jmeter.save.saveservice.thread_counts=true
# JMeter emits both sc and ec from this one switch.
jmeter.save.saveservice.sample_count=true
jmeter.save.saveservice.idle_time=true
jmeter.save.saveservice.bytes=true
jmeter.save.saveservice.sent_bytes=true
sample_variables=case_id,comma_value,quote_value
