# Static descriptor inputs for REPORT-001 and REPORT-002.
# These values mirror the explicit algorithm parameters recorded by the
# expectation files; no JMeter process is invoked by this corpus.
jmeter.save.saveservice.output_format=xml
jmeter.save.saveservice.timestamp_format=ms
jmeter.save.saveservice.hostname=false
jmeter.save.saveservice.sample_count=true
jmeter.save.saveservice.assertions=all
sample_variables=sample_id,suite_id
jmeter.reportgenerator.overall_granularity=10000
jmeter.reportgenerator.statistic_window=5
# The report generator's pinned Commons-Math legacy estimator is explicit in
# this static vector; it is intentionally distinct from the listener rank.
report_static.dashboard.percentile_estimator=LEGACY
jmeter.reportgenerator.apdex_satisfied_threshold=500
jmeter.reportgenerator.apdex_tolerated_threshold=1500
aggregate_rpt_pct1=50
aggregate_rpt_pct2=90
aggregate_rpt_pct3=99
