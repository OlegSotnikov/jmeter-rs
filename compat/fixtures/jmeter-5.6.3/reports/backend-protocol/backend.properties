# REPORT-003 static descriptor parameters. No backend listener or service is
# started by this corpus; values pin a future local adapter configuration.
backend_static.application=report-fixture
backend_metrics_percentile_estimator=LEGACY
backend_static.interval_start_ms=1704067200000
backend_static.interval_end_ms=1704067203000
backend_static.timezone=UTC

# Apache JMeter GraphiteBackendListenerClient arguments.
backend_static.graphite.metrics_sender=org.apache.jmeter.visualizers.backend.graphite.TextGraphiteMetricsSender
backend_static.graphite.host=127.0.0.1
backend_static.graphite.port=2003
backend_static.graphite.root_metrics_prefix=jmeter.
backend_static.graphite.percentiles=90;95;99
backend_static.graphite.samplers_list=backend/login;backend/failure
backend_static.graphite.use_regexp_for_samplers_list=false
backend_static.graphite.summary_only=false
backend_static.graphite.protocol=plaintext
backend_static.graphite.timestamp_precision=seconds

# Apache JMeter InfluxdbBackendListenerClient arguments.
backend_static.influxdb.metrics_sender=org.apache.jmeter.visualizers.backend.influxdb.HttpMetricsSender
backend_static.influxdb.url=http://127.0.0.1:8086/write?db=jmeter
backend_static.influxdb.application=report-fixture
backend_static.influxdb.measurement=jmeter
backend_static.influxdb.summary_only=false
backend_static.influxdb.samplers_regex=backend/(login|failure)
backend_static.influxdb.percentiles=99;95;90
backend_static.influxdb.test_title=REPORT-003 static descriptor
backend_static.influxdb.timestamp_precision=milliseconds
backend_static.credentials=none
