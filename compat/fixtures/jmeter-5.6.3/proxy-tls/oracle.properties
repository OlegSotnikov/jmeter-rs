# Original deterministic settings. Runtime ports, proxy flags, and keystore
# paths are supplied by the external runner and are intentionally absent.
jmeter.save.saveservice.output_format=xml
jmeter.save.saveservice.timestamp_format=none
jmeter.save.saveservice.time=true
jmeter.save.saveservice.latency=true
jmeter.save.saveservice.connect_time=true
jmeter.save.saveservice.timestamp=false
jmeter.save.saveservice.successful=true
jmeter.save.saveservice.label=true
jmeter.save.saveservice.response_code=true
jmeter.save.saveservice.response_message=true
jmeter.save.saveservice.thread_name=true
jmeter.save.saveservice.data_type=true
jmeter.save.saveservice.encoding=true
jmeter.save.saveservice.assertions=true
jmeter.save.saveservice.subresults=true
jmeter.save.saveservice.response_data=true
jmeter.save.saveservice.samplerData=true
jmeter.save.saveservice.responseHeaders=true
jmeter.save.saveservice.requestHeaders=true
jmeter.save.saveservice.bytes=true
jmeter.save.saveservice.sent_bytes=true
jmeter.save.saveservice.url=true
jmeter.save.saveservice.filename=true
jmeter.save.saveservice.hostname=false
jmeter.save.saveservice.thread_counts=true
jmeter.save.saveservice.sample_count=true
jmeter.save.saveservice.idle_time=true
jmeter.save.saveservice.response_data.on_error=true
httpsampler.max_redirects=5
httpsampler.max_frame_depth=5
httpsampler.max_bytes_to_store_per_request=1048576
httpclient4.retrycount=0
httpclient4.request_sent_retry_enabled=false
https.use.cached.ssl.context=false
# Recorder filter/header contract; certificate paths and passwords are
# runtime-only and deliberately absent.
proxy.content_type_include=text/html|text/plain|text/xml|application/json|application/xml
proxy.content_type_exclude=image/.*|text/css|application/(?:octet-stream|x-amf|x-java-serialized-object)
proxy.headers.remove=Cookie,Authorization
proxy.pause=5000
proxy.excludes.suggested=.*\\.(bmp|css|js|gif|ico|jpe?g|png|swf|woff|woff2)
